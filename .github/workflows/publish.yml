name: Publish

# Publishes on a version tag. Kept separate from ci.yml, and with no
# concurrency group, so a release is never cancelled by a later push.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole authentication story. npm exchanges this OIDC token for a
      # short-lived publish credential (trusted publishing) and for the signed
      # provenance attestation. There is deliberately no NPM_TOKEN secret —
      # nothing long-lived to leak, rotate, or pick the wrong type of.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1. Node 22 ships npm 10.x, which
      # authenticates the old way and fails with a 404/403 that reads like a
      # permissions problem rather than a version one. Upgrade before publish.
      - name: Upgrade npm for OIDC support
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # Publishing something that was never run is how a broken package ships.
      # This is the same end-to-end test CI runs: real download, real image.
      - name: Verify before publishing
        env:
          ARBO_OCR_TEST_IMAGE: receipt.jpg
        run: |
          curl -sfL -o receipt.jpg \
            https://raw.githubusercontent.com/wafik/ArboOCR/main/tests/fixtures/test_images/INDONESIAN_RECEIPT_ZZ_2025041400001.jpg
          npm test

      # Guards against tagging v0.4.0 while package.json still says 0.3.0 —
      # npm would happily publish the stale version under a misleading tag.
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package.json $pkg"; exit 1; }

      # No NODE_AUTH_TOKEN: authentication comes from the OIDC exchange above.
      # This requires a trusted publisher configured on npmjs.com for this
      # package, pointing at this repository and this workflow filename.
      # Provenance is implied by trusted publishing; passing it explicitly
      # makes the run fail loudly rather than quietly publishing unsigned.
      - run: npm publish --provenance --access public
